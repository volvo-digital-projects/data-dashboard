name: Sync Sales-DMS staff sales

on:
  schedule:
    # 07:00 KST = 22:00 UTC (previous UTC date)
    - cron: "0 22 * * *"
    # 09:00 KST = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sales-dms-sales-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: git pull --ff-only origin main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Sales-DMS browser dependencies
        run: |
          python -m pip install --disable-pip-version-check openpyxl==3.1.5 playwright==1.54.0
          python -m playwright install --with-deps chromium
      - name: Download and aggregate Actual Monthly Sales
        env:
          VOLVO_SALES_URL: ${{ secrets.VOLVO_SALES_URL }}
          VOLVO_SALES_ID: ${{ secrets.VOLVO_SALES_ID }}
          VOLVO_SALES_PASSWORD: ${{ secrets.VOLVO_SALES_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            if python scripts/sync-sales-dms-sales.py; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Sales-DMS 동기화 재시도 대기: ${attempt}/3"
            sleep 60
          done
      - name: Publish privacy-safe sales totals
        id: publish
        run: |
          git config user.name "Data Dashboard Auto Update"
          git config user.email "actions@users.noreply.github.com"
          git add app/data/sales-activity-analysis.json
          if git diff --cached --quiet; then
            echo "No staff sales change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Auto update Sales-DMS staff sales"
          git pull --rebase origin main
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy the latest sales data
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
