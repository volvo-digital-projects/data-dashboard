name: Sync weekly VOC and CX dashboard data

on:
  schedule:
    # Every Monday at 08:00 KST (23:00 UTC on Sunday).
    - cron: "0 23 * * 0"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: weekly-dashboard-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull --ff-only origin main
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install VOC workbook dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Read and validate the latest public workbook
        id: sync
        run: |
          sent_workbook="$RUNNER_TEMP/VOC발신건수.xlsx"
          response_workbook="$RUNNER_TEMP/voc회신건수.xlsx"
          trap 'rm -f "$sent_workbook" "$response_workbook"' EXIT

          node scripts/sync-google-sheet-data.mjs
          python scripts/download-google-sheet-voc-raw.py \
            --sent-output "$sent_workbook" \
            --response-output "$response_workbook"
          python scripts/sync-voc-sent-to-staff-analysis.py \
            --sent "$sent_workbook" \
            --voc "$response_workbook" \
            --analysis app/data/voc-staff-analysis.json
          python scripts/update-voc-2026-analysis.py --voc "$response_workbook"

          if git diff -I '"syncedAt":' --quiet -- app/data/weekly.json app/data/weekly-details.json; then
            git restore --worktree app/data/weekly.json app/data/weekly-details.json
          fi
          if git diff --quiet -- \
            app/data/weekly.json \
            app/data/weekly-details.json \
            app/data/voc-staff-analysis.json \
            app/data/voc-consultation.json \
            app/data/voc-sent.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify dashboard
        if: steps.sync.outputs.changed == 'true'
        run: npm test
      - name: Save verified weekly data
        id: publish
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "Data Dashboard Auto Update"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/data/weekly.json \
            app/data/weekly-details.json \
            app/data/voc-staff-analysis.json \
            app/data/voc-consultation.json \
            app/data/voc-sent.json
          git commit -m "Auto update weekly VOC and CX data"
          git restore --worktree public/dashboard-release.json
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy updated weekly data
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
