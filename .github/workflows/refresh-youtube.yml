name: Refresh YouTube metrics every 4 hours

on:
  schedule:
    # Six collections per day, every four hours (KST).
    # Keep the 23:59 KST collection as the midnight comparison baseline.
    - cron: "59 14 * * *"
    - cron: "59 2,6,10,18,22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: youtube-metrics-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and validate all public channels
        id: collect
        env:
          # Scheduled slots must not be skipped when the previous slot was delayed.
          FORCE_YOUTUBE_REFRESH: '1'
          CAPTURE_YOUTUBE_DAILY_CLOSE: ${{ github.event.schedule == '59 14 * * *' && '1' || '0' }}
        run: |
          python scripts/refresh-youtube-metrics.py
          if git diff --quiet -- app/data/youtube-creators.json; then
            echo "refreshed=false" >> "$GITHUB_OUTPUT"
          else
            echo "refreshed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Sales-DMS browser dependencies
        if: steps.collect.outputs.refreshed == 'true'
        run: |
          python -m pip install --disable-pip-version-check openpyxl==3.1.5 playwright==1.54.0
          python -m playwright install --with-deps chromium
      - name: Refresh staff sales with the four-hour YouTube snapshot
        if: steps.collect.outputs.refreshed == 'true'
        env:
          VOLVO_SALES_URL: ${{ secrets.VOLVO_SALES_URL }}
          VOLVO_SALES_ID: ${{ secrets.VOLVO_SALES_ID }}
          VOLVO_SALES_PASSWORD: ${{ secrets.VOLVO_SALES_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            if python scripts/sync-sales-dms-sales.py; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Sales-DMS 동기화 재시도 대기: ${attempt}/3"
            sleep 60
          done
      - uses: actions/setup-node@v4
        if: steps.collect.outputs.refreshed == 'true'
        with:
          node-version: '22.13.0'
          cache: npm
      - if: steps.collect.outputs.refreshed == 'true'
        run: npm ci
      - name: Refresh public comments when API is configured
        if: steps.collect.outputs.refreshed == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -n "$YOUTUBE_API_KEY" ]; then
            python scripts/refresh-youtube-comments.py
          else
            echo "YouTube API key not configured; retaining reviewed sample / last snapshot."
          fi
      - name: Verify dashboard and data
        if: steps.collect.outputs.refreshed == 'true'
        run: |
          python -m unittest discover -s tests -p "test_youtube*.py"
          npm test
      - name: Save verified snapshot on main
        id: publish
        if: steps.collect.outputs.refreshed == 'true'
        run: |
          git config user.name "Data Dashboard Auto Update"
          git config user.email "actions@users.noreply.github.com"
          # The release manifest is generated by the Pages build. Keeping it out
          # of this data-only commit prevents collisions with concurrent UI work.
          git add app/data/youtube-creators.json app/data/youtube-comments.json app/data/sales-activity-analysis.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto update four-hour YouTube and staff sales metrics"
            git restore --worktree public/dashboard-release.json
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      # GITHUB_TOKEN pushes do not trigger other push workflows.
      - name: Deploy updated snapshot
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
