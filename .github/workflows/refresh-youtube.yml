name: Refresh YouTube metrics hourly

on:
  schedule:
    # Two watchdog opportunities per hour compensate for delayed/dropped GitHub
    # schedules. The collector itself enforces a 55-minute minimum interval.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: youtube-metrics-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and validate all public channels
        id: collect
        env:
          FORCE_YOUTUBE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          python scripts/refresh-youtube-metrics.py
          if git diff --quiet -- app/data/youtube-creators.json; then
            echo "refreshed=false" >> "$GITHUB_OUTPUT"
          else
            echo "refreshed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.collect.outputs.refreshed == 'true'
        with:
          node-version: '22.13.0'
          cache: npm
      - if: steps.collect.outputs.refreshed == 'true'
        run: npm ci
      - name: Refresh public comments when API is configured
        if: steps.collect.outputs.refreshed == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -n "$YOUTUBE_API_KEY" ]; then
            python scripts/refresh-youtube-comments.py
          else
            echo "YouTube API key not configured; retaining reviewed sample / last snapshot."
          fi
      - name: Verify dashboard and data
        if: steps.collect.outputs.refreshed == 'true'
        run: |
          python -m unittest discover -s tests -p "test_youtube*.py"
          npm test
      - name: Save verified snapshot on main
        id: publish
        if: steps.collect.outputs.refreshed == 'true'
        run: |
          git config user.name "Data Dashboard Auto Update"
          git config user.email "actions@users.noreply.github.com"
          # The release manifest is generated by the Pages build. Keeping it out
          # of this data-only commit prevents collisions with concurrent UI work.
          git add app/data/youtube-creators.json app/data/youtube-comments.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto update hourly YouTube channel metrics"
            git restore --worktree public/dashboard-release.json
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      # GITHUB_TOKEN pushes do not trigger other push workflows.
      - name: Deploy updated snapshot
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
