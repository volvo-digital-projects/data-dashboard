name: Sync Sales-DMS staff roster

on:
  schedule:
    # 06:00 every morning in Asia/Seoul (21:00 UTC on the previous day).
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sales-dms-roster-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: git pull --ff-only origin main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install browser and image dependencies
        run: |
          python -m pip install --disable-pip-version-check openpyxl==3.1.5 opencv-python-headless==4.12.0.88 pillow==11.3.0 playwright==1.54.0
          python -m playwright install --with-deps chromium
      - name: Reconcile active Sales-DMS staff
        env:
          VOLVO_SALES_URL: ${{ secrets.VOLVO_SALES_URL }}
          VOLVO_SALES_ID: ${{ secrets.VOLVO_SALES_ID }}
          VOLVO_SALES_PASSWORD: ${{ secrets.VOLVO_SALES_PASSWORD }}
        run: python scripts/sync-sales-dms-roster.py
      - name: Refresh public dealer portraits
        run: python scripts/sync-staff-profile-photos.py
      - name: Publish verified roster changes
        run: |
          git config user.name "Data Dashboard Auto Update"
          git config user.email "actions@users.noreply.github.com"
          git add app/data/voc-staff-analysis.json app/data/staff-profile-photos.json public/staff-profiles
          if git diff --cached --quiet; then
            echo "No roster or portrait change."
            exit 0
          fi
          git commit -m "Auto update Sales-DMS staff roster"
          git push origin main
