name: ONE VOICE daily watchdog

on:
  schedule:
    # 10:23 KST, Monday-Friday. The script itself skips Korean holidays.
    - cron: "23 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-voice-daily-watchdog
  cancel-in-progress: false

jobs:
  check-daily-slot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ONE_VOICE_SITE_URL: https://volvo-dsc-pc-test-2026.sosoobi.chatgpt.site
      ONE_VOICE_INGEST_TOKEN: ${{ secrets.ONE_VOICE_INGEST_TOKEN }}
      ONE_VOICE_EXTRA_HOLIDAYS: ${{ vars.ONE_VOICE_EXTRA_HOLIDAYS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare daily snapshot
        run: node scripts/one-voice/check-cloud.mjs
